const chips = document.getElementById('chips');
const detail = document.getElementById('detail');

function renderChip(idea, active) {
  return `<div class="idea-chip${active ? ' active' : ''}" onclick="select(${idea.id})">
    <div class="chip-icon"><i class="ti ${idea.icon}" aria-hidden="true"></i></div>
    <p class="chip-title">${idea.title}</p>
    <p class="chip-tag">${idea.tag}</p>
  </div>`;
}

function renderDetail(idea) {
  const agentFlow = idea.agents.map(a =>
    a.label === '→'
      ? `<span class="arrow">→</span>`
      : `<span class="agent-node ${a.cls}">${a.label}</span>`
  ).join('');

  const badgeHtml = idea.badges.map((b,i) =>
    `<span class="badge ${idea.badgeClasses[i]}">${b}</span>`
  ).join('');

  const features = idea.features.map(f =>
    `<li><i class="ti ti-check" aria-hidden="true"></i><span>${f}</span></li>`
  ).join('');

  const stack = idea.stack.map(s =>
    `<span class="stack-pill">${s}</span>`
  ).join('');

  return `<div class="detail-header">
    <div>
      <p class="detail-title"><i class="ti ${idea.icon}" style="font-size:16px; margin-right:6px; vertical-align:-1px" aria-hidden="true"></i>${idea.title}</p>
      <p class="detail-subtitle">${idea.subtitle}</p>
    </div>
  </div>
  <div class="badge-row">${badgeHtml}</div>
  <div style="font-size:13px; color:var(--color-text-secondary); margin-bottom:1rem; line-height:1.55;">${idea.problem}</div>
  <div class="metrics-row">
    <div class="metric-box"><p class="metric-label">${idea.tamLabel}</p><p class="metric-val">${idea.tam}</p></div>
    <div class="metric-box"><p class="metric-label">MVP timeline</p><p class="metric-val">${idea.time}</p></div>
    <div class="metric-box"><p class="metric-label">Key outcome</p><p class="metric-val" style="font-size:14px;">${idea.roi}</p></div>
  </div>
  <p class="section-label">Agent architecture</p>
  <div class="agent-flow" style="margin-bottom:1rem;">${agentFlow}</div>
  <p class="section-label">Core capabilities</p>
  <ul class="feature-list">${features}</ul>
  <p class="section-label">Tech stack</p>
  <div class="stack-pills">${stack}</div>
  <div class="action-row">
    <button onclick="sendPrompt('${idea.demoPrompt}')">Build this prototype ↗</button>
    <button onclick="sendPrompt('Give me the full technical architecture for ${idea.title}, including ADK agent code, data flow, API design, and deployment plan on Google Cloud.')">Full architecture ↗</button>
    <button onclick="sendPrompt('What are the biggest technical risks and open questions for building ${idea.title}?')">Technical risks ↗</button>
  </div>`;
}

let current = 0;

function select(id) {
  current = id;
  chips.innerHTML = ideas.map(i => renderChip(i, i.id === id)).join('');
  detail.innerHTML = renderDetail(ideas[id]);
  chips.querySelectorAll('.idea-chip')[id].scrollIntoView({behavior:'smooth', block:'nearest'});
}

chips.innerHTML = ideas.map(i => renderChip(i, i.id === 0)).join('');
detail.innerHTML = renderDetail(ideas[0]);
</script>
